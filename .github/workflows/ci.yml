name: Application CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.oat/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths-ignore:
      - 'docs/**'
      - '.oat/**'

permissions:
  contents: read

# Base retargets revalidate; ignored draft/title/body events must not replace ready checks.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'pull_request' &&
    !github.event.pull_request.draft &&
    (github.event.action != 'edited' || github.event.changes.base.ref) &&
    format('pr-{0}', github.event.pull_request.number) ||
    github.run_id
    }}
  cancel-in-progress: >-
    ${{
    github.event_name == 'pull_request' &&
    !github.event.pull_request.draft &&
    (github.event.action != 'edited' || github.event.changes.base.ref)
    }}

jobs:
  verify:
    name: >-
      ${{
      (github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      (github.event.action != 'edited' || github.event.changes.base.ref))) &&
      'verify' ||
      'verify (event ignored)'
      }}
    if: >-
      ${{
      github.event_name != 'pull_request' ||
      (!github.event.pull_request.draft &&
      (github.event.action != 'edited' || github.event.changes.base.ref))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GIT_HOOKS: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Next.js route types
        run: pnpm --filter @sequence/web exec next typegen
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Hermetic tests
        run: pnpm test
      - name: Build
        run: pnpm build
